<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="https://cdn.tailwindcss.com"></script>
        <title>将棋カフェ</title>
    </head>
    <body class="bg-orange-200">
        <header class="bg-amber-300 shadow-md p-4">
            <h1 class="text-2xl font-bold text-gray-900">将棋カフェ</h1>
            <p class="text-gray-600 text-sm mt-1">将棋を指しながらコーヒーが飲めるカフェ</p>
        </header>
        <main class="max-w-2xl mx-auto px-4 py-8">

            <h2 class="text-2xl font-bold text-gray-800 text-center py-2">メニュー</h2>
            <section class="p-8">

                <div class="bg-orange-100 shadow-md rounded-lg p-6 mb-4">
                    <h3 class="text-gray-800 text-lg font-bold py-2">軽食andコーヒー付き将棋盤セット</h3>
                    <p class="text-gray-600 text-base py-2">一番人気！軽食は下の項目から2種のサンドウィッチを選べます。</p>
                    <p class="hover:text-blue-600 text-lg py-2">９００円</p>
                </div>

                <div class="bg-orange-100 shadow-md rounded-lg p-6 mb-4">
                    <h3 class="text-gray-800 text-lg font-bold py-2">コーヒー付き将棋盤セット</h3>
                    <p class="text-gray-600 text-base py-2">ワンコインのお手頃セット！サクッと将棋を指したい方にお勧め！</p>
                    <p class="hover:text-blue-600 text-lg py-2">５００円</p>
                </div>
            </section>
            
            <h2 class="text-2xl font-bold text-gray-800 text-center mt-4">選べるサンドイッチ</h2>
            <section class="p-8">
                <div class="bg-orange-100 shadow-md rounded-lg p-6 mb-4">
                    <ol class="text-base text-gray-800">
                        <li class="py-2">・ツナ</li>
                        <li class="py-2">・タマゴ</li>
                        <li class="py-2">・サラダ</li>
                        <li class="py-2">・季節のジャム</li>
                    </ol>
                </div>
            </section>

            <h2 class="text-2xl font-bold text-gray-800 text-center mt-4">選べるコーヒー</h2>
            <section class="p-8">
                <div class="bg-orange-100 shadow-md rounded-lg p-6 mb-4">
                    <ol class="text-base text-gray-800">
                        <li class="py-2">・アメリカン</li>
                        <li class="py-2">・カフェオレ</li>
                        <li class="py-2">・カプチーノ</li>
                        <li class="py-2">・エスプレッソ</li>
                    </ol>
                </div>
            </section>
                
        </main>
        <footer class="bg-orange-300 text-gray-500 text-center py-8">
            <p>2026 Shogi Cafe</p>
        </footer>
    </body>
</html>
